description: 'Delek US Holdings, Inc. (NYSE: DK) is a downstream energy company. It provides
  investor relations and ESG reporting on its public website but does not publish a developer API,
  sandbox, or pricing tier. Logistics partners (NYSE: DKL) likewise do not publish APIs. Partner
  integrations occur through EDI, terminal automation, and ticketing systems negotiated
  bilaterally.'
sources:
