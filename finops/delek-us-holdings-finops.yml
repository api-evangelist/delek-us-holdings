meters:
  - name: bilateral_integrations
    description: Active partner integrations (EDI feeds, terminal-automation links, ticketing
      bridges) across refining, logistics, and retail business lines.
    unit: integration
    aggregation: max
    dimensions:
      - partner
      - business_line
      - integration_type
principles:
  - name: Visibility
    description: There is no API invoice. Track partner-integration spend through procurement,
      logistics, and IT-services contracts rather than developer-portal usage.
  - name: Allocation
    description: Allocate any integration-related cost to the refining, logistics, or retail
      business unit that owns the partner relationship.
  - name: Optimization
    description: Consolidate redundant EDI feeds across affiliates (Delek Logistics, retail
      stores), prefer modern terminal-automation protocols, and retire legacy bridges to reduce
      operational toil.
  - name: Accountability
    description: Designate a single integration owner per partner per business line so EDI map
      maintenance and ticketing-bridge SLAs have a clear escalation path.
