description: 'FOCUS-aligned FinOps for Delek US Holdings: a downstream energy company with no
  public developer API. No API invoice line exists. Commercial relationships flow through
  product-supply, terminaling, midstream-logistics, and retail-fuel agreements rather than per-call
  billing.'
