aid: delek-us-holdings
name: Delek US Holdings
description: >-
  Delek US Holdings, Inc. (NYSE: DK) is a diversified downstream energy
  company headquartered in Brentwood, Tennessee with assets in petroleum
  refining, logistics, asphalt operations, renewable fuels, and convenience
  store retailing. Delek operates four refineries in Tyler and Big Spring
  (Texas), El Dorado (Arkansas), and Krotz Springs (Louisiana) with combined
  crude throughput capacity of roughly 302,000 barrels per day. Logistics
  assets are operated through Delek Logistics Partners (NYSE: DKL). The
  company provides investor relations and ESG reporting on its public
  website but does not publish a developer API; partner integrations occur
  through industry-standard EDI, terminal automation, and ticketing systems.
